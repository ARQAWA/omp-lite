# Claude Code's own files: CLAUDE.md, .claude/, ~/.claude/, its marketplace plugins. Claude models stay.
  - claude
  - claude-md
  - claude-plugins
retry:
  fallbackChains:
    web: []
symbolPreset: unicode
composer:
  shape: claude
  predictions: true
  predictionAlternatives: false
theme:
  dark: dark-copper
update:
  auto: false
setupVersion: 3
hideThinkingBlock: true
proseOnlyThinking: false
doubleEscapeAction: rewind
spelling:
  typoDetection: false
  autocomplete: "off"
emojiAutocomplete: false
dev:
  autoqaConsent: denied
autolearn:
  enabled: false
display:
  showTokenUsage: false
  hideToolActivity: false
  subagentLivePreview: false
  smoothStreaming: false
  showTurnTime: true
  shellVisualization: false
  collapseCompacted: true
tui:
  autoGraph: "off"
  imeSafeCursor: true
recap:
  idleSeconds: 600
tools:
  approvalMode: yolo
startup:
  quiet: true
  showSplash: false
  checkUpdate: false
edit:
  autoRepair:
    enabled: true
lsp:
  enabled: false
claudeResets:
  autoRedeem5h: "no"
  autoRedeemWeekly: "no"
