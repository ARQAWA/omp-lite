modelRoles:
  web: openai-codex/gpt-6-luna
enabledModels:
  # Startup preference; the extension fills the live scope from the catalog.
  - anthropic/claude-sonnet-5-5
  - "anthropic/*"
  - "openai-codex/*"
  - "opencode-go/*"
  - openrouter/deepseek/deepseek-v4.1-flash-1017
  - "zai/*"
# The :floor variant is what reaches the OpenRouter flex tier.
providers:
  openrouterVariant: floor
  cacheWarmingStrategy: keepalive
  openaiLiveSteering: true
# Only anthropic, openai-codex, opencode-go, openrouter and zai stay open.
disabledProviders:
  - google
  - local
  - web
  - cursor
  - ollama
  - deepseek
  - "llama.cpp"
  - amazon-bedrock
  - bedrock-mantle
