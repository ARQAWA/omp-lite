modelRoles:
  default: deepseek/deepseek-flash:max
  web: openai-codex/gpt-6-luna
  memory: deepseek/deepseek-flash:max
enabledModels:
  - anthropic/*
  - openai-codex/*
  - opencode-go/*
  - deepseek/*
disabledProviders:
  - google
  - openrouter
  - local
  - web
  - cursor
  - ollama
retry:
  fallbackChains:
    web: []
    memory:
      - opencode-go/deepseek-v4.1-flash:max
compaction:
  modelThresholds:
    opencode-go/deepseek-v4.1-flash: f400000
    openai-codex/gpt-6.1-sol: f400000
    openai-codex/gpt-6.1-terra: f400000
    deepseek/deepseek-flash: f400000
    anthropic/claude-fable-5: f400000
    anthropic/claude-fable-5-1: f400000
    anthropic/claude-mythos-5: f400000
    anthropic/claude-mythos-5-1: f400000
    anthropic/claude-opus-4-6: f400000
    anthropic/claude-opus-4-7: f400000
    anthropic/claude-opus-4-8: f400000
    anthropic/claude-opus-5: f400000
    anthropic/claude-opus-5-5: f400000
    anthropic/claude-sonnet-4-6: f400000
    anthropic/claude-sonnet-5: f400000
    anthropic/claude-sonnet-5-5: f400000
symbolPreset: unicode
composer:
  shape: claude
  predictions: true
  predictionAlternatives: false
  tokenRate: true
theme:
  dark: dark-copper
update:
  auto: false
setupVersion: 3
hideThinkingBlock: true
proseOnlyThinking: false
statusLine:
  compactThinkingLevel: false
  showHookStatus: true
  separator: powerline-thin
doubleEscapeAction: rewind
spelling:
  typoDetection: false
  autocomplete: "off"
emojiAutocomplete: false
dev:
  autoqaConsent: granted
memory:
  backend: mnemopi
autolearn:
  enabled: true
astGrep:
  enabled: false
find:
  enabled: "off"
display:
  showTokenUsage: false
  hideToolActivity: true
  subagentLivePreview: false
  smoothStreaming: true
  showTurnTime: true
  shellVisualization: false
  collapseCompacted: false
tui:
  imeSafeCursor: true
task:
  showResolvedModelBadge: true
  maxConcurrency: 100
recap:
  idleSeconds: 600
mnemopi:
  embeddingModel: embeddinggemma-2:270m
  embeddingApiUrl: http://127.0.0.1:11434/v1
  embeddingApiKey: ollama
tools:
  artifactSpillThreshold: 50
  artifactHeadBytes: 50
  artifactTailBytes: 0
  artifactMaxBytes: 32
  artifactTailLines: 0
  outputMaxColumns: 0
  approvalMode: yolo
read:
  defaultLimit: 4000
  summarize:
    enabled: false
startup:
  quiet: true
  showSplash: false
  checkUpdate: false
edit:
  autoRepair:
    enabled: true
lsp:
  diagnosticsOnEdit: true