doubleEscapeAction: rewind
spelling:
  typoDetection: false
  autocomplete: "off"
emojiAutocomplete: false
dev:
  autoqaConsent: granted
memory:
  backend: mnemopi
autolearn:
  enabled: true
astGrep:
  enabled: false
find:
  enabled: "off"
display:
  showTokenUsage: false
  hideToolActivity: false
  subagentLivePreview: false
  smoothStreaming: true
  showTurnTime: true
  shellVisualization: false
  collapseCompacted: false
tui:
  imeSafeCursor: true
task:
  showResolvedModelBadge: true
  maxConcurrency: 100
  perCallModel: "on"
  enableEffort: false
  agentModelOverrides:
    scout: openai-codex/gpt-6.1-terra:xhigh
    sonic: openai-codex/gpt-6.1-terra:medium
