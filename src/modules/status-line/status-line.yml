# Статуслайн OMP для omp-lite. Слить в ~/.omp/agent/config.yml.
composer:
  tokenRate: true
statusLine:
  preset: custom
  separator: powerline-thin
  showHookStatus: false
  leftSegments: [pi, model, mode, path, git, pr, subagents]
  rightSegments: [status, cache_hit, context_pct]
  segmentOptions:
    model:
      showThinkingLevel: true
    path:
      abbreviate: true
      maxLength: 40
      stripWorkPrefix: true
    git:
      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: true
