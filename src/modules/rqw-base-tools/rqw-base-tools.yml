edit:
  mode: hashline
  autoRepair:
    enabled: true
grep:
  contextBefore: 3
  contextAfter: 3
read:
  defaultLimit: 4000
  summarize:
    enabled: false
tools:
  intentTracing: false
  artifactSpillThreshold: 100
  outputMaxColumns: 0
  artifactHeadBytes: 50
  artifactTailBytes: 0
  artifactMaxBytes: 32
  artifactTailLines: 0
inlineToolDescriptors: "off"
astGrep:
  enabled: false
astEdit:
  enabled: false
debug:
  enabled: false
eval:
  py: false
find:
  enabled: "off"
disassembler:
  backend: none
